<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      예전 라운드 URL(/…/round-pouch-test/) → 새 URL(/round-pouch-test/…/)로
      옮겨 간다. 링크/검색엔진에 남은 옛 주소를 이어 준다. 공개 시 noindex를
      떼어도 리다이렉트 동작은 그대로다.
    -->
    <meta http-equiv="refresh" content="0; url=../../round-pouch-test/ja/" />
    <title>Redirect</title>
  </head>
  <body>
    <p>Redirecting to <a href="../../round-pouch-test/ja/">this page</a>…</p>
    <script>location.replace('../../round-pouch-test/ja/');</script>
  </body>
</html>
